<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper Heart Shooter 🎯</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Gun Pointer Cursor -->
    <div class="gun-cursor" id="gun">🔫</div>

    <div class="header">
        <h1>বন্দুক দিয়ে পুটকি nishana koro ! 🔫🎯</h1>
        <p>বঙ্গবন্ধুর পুটকিতে মারো </p>
        <div id="status"></div>
    </div>

    <!-- Target Person Box -->
    <div class="target" id="target">
        <img src="target.png.png" alt="Target Person" class="target-img">
    </div>

    <!-- Audio Tag -->
    <audio id="bgMusic" src="music.mp3" preload="auto"></audio>

    <script src="js/app.js"></script>
</body>
</html>
